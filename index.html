<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPTV Web Channel Player</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

header {
  padding: 10px;
  background: #1e293b;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.container {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 30%;
  overflow-y: auto;
  background: #111827;
  border-right: 1px solid #333;
}

.search {
  padding: 10px;
}

.search input {
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  border: none;
}

.channel {
  padding: 10px;
  cursor: pointer;
  border-bottom: 1px solid #222;
}

.channel:hover {
  background: #1f2937;
}

.player-area {
  flex: 1;
  display: flex;
  flex-direction: column;
}

video {
  width: 100%;
  height: 70%;
  background: black;
}

.info {
  padding: 10px;
  background: #020617;
}
</style>

</head>
<body>

<header>📺 IPTV Web Player</header>

<div class="container">

  <div class="sidebar">
    <div class="search">
      <input type="text" id="search" placeholder="Search channel...">
    </div>
    <div id="channelList"></div>
  </div>

  <div class="player-area">
    <video id="video" controls autoplay></video>
    <div class="info" id="info">Select a channel</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const PLAYLIST_URL = "https://iptv-org.github.io/iptv/index.m3u";

let allChannels = [];

async function loadPlaylist() {
  try {
    const res = await fetch(PLAYLIST_URL);
    const text = await res.text();
    parseM3U(text);
  } catch (err) {
    alert("Failed to load playlist (CORS issue likely)");
    console.error(err);
  }
}

function parseM3U(data) {
  const lines = data.split("\n");
  let channels = [];

  for (let i = 0; i < lines.length; i++) {
    if (lines[i].startsWith("#EXTINF")) {
      const name = lines[i].split(",")[1]?.trim();
      const url = lines[i + 1]?.trim();

      if (name && url) {
        channels.push({ name, url });
      }
    }
  }

  allChannels = channels;
  displayChannels(channels);
}

function displayChannels(channels) {
  const container = document.getElementById("channelList");
  container.innerHTML = "";

  channels.forEach(ch => {
    const div = document.createElement("div");
    div.className = "channel";
    div.textContent = ch.name;

    div.onclick = () => playStream(ch);

    container.appendChild(div);
  });
}

function playStream(channel) {
  const video = document.getElementById("video");
  const info = document.getElementById("info");

  info.textContent = "Playing: " + channel.name;

  if (window.hls) {
    window.hls.destroy();
  }

  if (Hls.isSupported()) {
    const hls = new Hls();
    window.hls = hls;

    hls.loadSource(channel.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play();
    });

  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = channel.url;
    video.play();
  } else {
    alert("Stream not supported");
  }
}

document.getElementById("search").addEventListener("input", function() {
  const query = this.value.toLowerCase();

  const filtered = allChannels.filter(ch =>
    ch.name.toLowerCase().includes(query)
  );

  displayChannels(filtered);
});

loadPlaylist();
</script>

</body>
</html>
